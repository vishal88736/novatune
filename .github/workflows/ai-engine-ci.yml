name: ai-engine-ci

on:
  pull_request:
    paths: ["ai-engine/**"]
  push:
    branches: [main, develop]
    paths: ["ai-engine/**"]

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
      - name: Run golden-set regression eval
        run: python -m evaluation.offline_eval.eval_mood_agent
