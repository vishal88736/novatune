name: vibeai

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vibeai
      POSTGRES_PASSWORD: vibeai
      POSTGRES_DB: vibeai
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibeai"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["6379:6379"]
    volumes:
      - redis_data:/data

  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    ports: ["6333:6333", "6334:6334"]
    volumes:
      - qdrant_storage:/qdrant/storage

  ai-engine:
    build:
      context: ../../ai-engine
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ../../ai-engine/.env
    environment:
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
    ports: ["8100:8100"]
    depends_on:
      - qdrant
      - redis
    volumes:
      - ../../ai-engine:/app

  backend:
    build:
      context: ../../website/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ../../website/backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://vibeai:vibeai@postgres:5432/vibeai
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      AI_ENGINE_BASE_URL: http://ai-engine:8100
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      ai-engine:
        condition: service_started
    volumes:
      - ../../website/backend:/app

  celery-worker:
    build:
      context: ../../website/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=info
    env_file: ../../website/backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://vibeai:vibeai@postgres:5432/vibeai
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      AI_ENGINE_BASE_URL: http://ai-engine:8100
    depends_on:
      - postgres
      - redis
      - ai-engine
    volumes:
      - ../../website/backend:/app

  celery-beat:
    build:
      context: ../../website/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A app.workers.celery_app beat --loglevel=info
    env_file: ../../website/backend/.env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      - redis
    volumes:
      - ../../website/backend:/app

  frontend:
    build:
      context: ../../website/frontend
      dockerfile: ../../infra/docker/frontend.Dockerfile
    restart: unless-stopped
    env_file: ../../website/frontend/.env.local
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000
    ports: ["3000:3000"]
    depends_on:
      - backend
    volumes:
      - ../../website/frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
  redis_data:
  qdrant_storage:
