name: backend-ci

on:
  pull_request:
    paths: ["website/backend/**"]
  push:
    branches: [main, develop]
    paths: ["website/backend/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vibeai
          POSTGRES_PASSWORD: vibeai
          POSTGRES_DB: vibeai_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    defaults:
      run:
        working-directory: website/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy app
      - run: pytest
        env:
          DATABASE_URL: postgresql+asyncpg://vibeai:vibeai@localhost:5432/vibeai_test
          REDIS_URL: redis://localhost:6379/0
