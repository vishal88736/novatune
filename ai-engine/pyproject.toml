[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vibeai-ai-engine"
version = "0.1.0"
description = "VibeAI's multi-agent AI microservice — Groq orchestration, embeddings, GoEmotions, Qdrant"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.1",
  "groq==0.13.1",
  "sentence-transformers==3.3.1",
  "transformers==4.47.1",
  "torch==2.5.1",
  "qdrant-client==1.12.1",
  "redis==5.2.1",
  "httpx==0.28.1",
  "structlog==24.4.0",
  "numpy==2.2.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.25.1",
  "ruff==0.8.4",
  "mypy==1.14.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
  "agents*",
  "evaluation*",
  "orchestrator*",
  "pipelines*",
  "prompts*",
  "providers*",
  "service*",
  "vector_store*",
]
exclude = ["tests*"]

[tool.ruff]
line-length = 100
target-version = "py312"
