[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vibeai-backend"
version = "0.1.0"
description = "VibeAI product API — auth bridge, persistence, orchestration entrypoint"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "sqlalchemy[asyncio]==2.0.36",
  "asyncpg==0.30.0",
  "alembic==1.14.0",
  "pydantic==2.10.4",
  "pydantic-settings==2.7.1",
  "celery==5.4.0",
  "redis==5.2.1",
  "httpx==0.28.1",
  "python-multipart==0.0.20",
  "python-jose[cryptography]==3.3.0",
  "google-api-python-client==2.157.0",
  "structlog==24.4.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.4",
  "pytest-asyncio==0.25.1",
  "ruff==0.8.4",
  "mypy==1.14.0",
  "httpx==0.28.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["alembic*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Celery's @celery_app.task decorator ships no type information, so mypy
# cannot see the wrapped function's signature. Task bodies stay fully typed.
module = ["app.workers.*"]
disable_error_code = ["misc"]
